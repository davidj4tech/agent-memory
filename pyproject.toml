[project]
name = "sacred-brain-hippocampus"
version = "0.1.0"
description = "FastAPI microservice that exposes a Mem0-backed memory API"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Sacred Brain" }
]
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.23",
  "pydantic>=2.5",
  "python-multipart>=0.0.6",
  "httpx>=0.25",
  "mem0ai>=1.0.1",
  "agno>=2.3.0",
  "mcp>=1.27.0",
]

[project.scripts]
hippocampus = "brain.hippocampus.__main__:main"
memory-governor = "memory_governor.app:run"

[tool.setuptools.packages.find]
include = ["brain*", "memory_governor*", "sacred_brain*"]
namespaces = true

[tool.setuptools.package-data]
"sacred_brain.prompts" = ["*.txt"]

[project.optional-dependencies]
# NB: kerykeion (Swiss Ephemeris / pyswisseph C build) is intentionally NOT a
# dependency here. Astrology/natal computation belongs to the *astrotunes*
# project, which owns kerykeion; sacred-brain's astrology code (memory_governor
# oracle, scripts/natal_to_sacred_brain) should delegate there. The hippocampus
# core needs none of it (the sqlite backend is lexical — no embeddings/LLM).
dev = [
  "pytest>=7.4",
  "ruff>=0.3.0",
  "mypy>=1.9.0",
  "types-requests",
  "types-ujson",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "PL"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

